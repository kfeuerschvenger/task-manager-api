# Self-contained test stack: no .env file and no published ports.
# Run with: docker compose -f docker-compose-test.yml up --abort-on-container-exit --exit-code-from test
# Clean up with: docker compose -f docker-compose-test.yml down -v
# The credentials below are throwaway values for a database that is only reachable inside this compose network.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmanager_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d taskmanager_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    image: golang:1.24.3-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: taskmanager_test
      JWT_SECRET: test-only-jwt-secret-at-least-32-bytes-long
      MIGRATIONS_PATH: file:///app/database/migrations
    depends_on:
      db:
        condition: service_healthy
    command: go test ./... -count=1 -v
