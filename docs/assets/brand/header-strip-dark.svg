  <g transform="translate(36 24) scale(1.5)" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#00ADD8">
      <path d="M11 5C8 5 8 7 8 9V13C8 15 6 16 5 16C6 16 8 17 8 19V23C8 25 8 27 11 27"/>
      <path d="M21 5C24 5 24 7 24 9V13C24 15 26 16 27 16C26 16 24 17 24 19V23C24 25 24 27 21 27"/>
    </g>
    <path d="M12 16.5L15 19.5L20.5 12.5" stroke="#22C55E"/>
  </g>
  <g>
    <circle class="pulse" cx="1150" cy="48" r="7" fill="#94A3B8"/>
    <circle class="pulse p2" cx="1190" cy="48" r="7" fill="#F59E0B"/>
    <circle class="pulse p3" cx="1230" cy="48" r="7" fill="#22C55E"/>
  </g>
