<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 96" role="img" aria-label="Task Manager API">
  <defs>
    <linearGradient id="tm-ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1A2740"/>
    </linearGradient>
    <linearGradient id="tm-fade" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#00ADD8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ADD8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#00ADD8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: tm-pulse 6s ease-in-out infinite backwards; }
      .p2 { animation-delay: 0.8s; }
      .p3 { animation-delay: 1.6s; }
      @keyframes tm-pulse { 0% { opacity: 0.25; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0.25; } }
    }
  </style>
  <rect width="1280" height="96" rx="14" fill="url(#tm-ground)"/>
